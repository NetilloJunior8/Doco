services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doco_catalog
      POSTGRES_USER: doco
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_prod}
    volumes:
      - doco_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doco -d doco_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:23-jre
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/doco_catalog
      DATABASE_USER: doco
      DATABASE_PASSWORD: ${DB_PASSWORD:-change_me_in_prod}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-https://doco.mx}
      JWT_SECRET: ${JWT_SECRET:-replace-with-secure-64-char-random-secret-before-production!}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "8080:8080"

volumes:
  doco_pg_data:
