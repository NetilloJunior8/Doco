spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/doco_catalog}
    username: ${DATABASE_USER:doco}
    password: ${DATABASE_PASSWORD:doco_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/postgres
